<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9tepay Merchant Gateway</title>
    <meta name="description" content="9tepay Merchant Gateway - UPI payment gateway with merchant dashboard, dynamic QR, one-click mobile deeplink intents (GPay, PhonePe, Paytm, BHIM), and developer REST APIs." />
    <meta property="og:title" content="9tepay Merchant Gateway" />
    <meta property="og:description" content="9tepay Merchant Gateway - UPI payment gateway with merchant dashboard, dynamic QR, one-click mobile deeplink intents (GPay, PhonePe, Paytm, BHIM), and developer REST APIs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="color:red; font-family:sans-serif; padding: 20px; z-index:9999; position:relative;"><h1>CRASH LOG: ' + String(e.error?.message || e.message) + '</h1><pre>' + String(e.error?.stack || '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="color:red; font-family:sans-serif; padding: 20px; z-index:9999; position:relative;"><h1>UNHANDLED PROMISE: ' + String(e.reason) + '</h1></div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
